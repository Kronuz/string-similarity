name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly: { type: boolean, default: false }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
    with:
      nightly: ${{ inputs.nightly || false }}
      # The sanitizer build stays Debug; -O1 keeps the long randomized tests within the job's limit.
      asan_cxx_flags: -O1
